<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Q2</title>
</head>
<body>
  <h1>Registration Form</h1>
  <form action="/server">
    <div>
      <input type="text" placeholder="First Name" name="fname">
      <input type="text" placeholder="Second Name" name="sname">
    </div>

    <div>
      <label for="gender">Please select gender</label>
      <select name="gender" id="gender">
        <option value="m">Male</option>
        <option value="f">Female</option>
        <option value="o">Others</option>

      </select>
    </div>

    <div>
      Do you agree to all terms of service?
      <label for="tos_agree">Yes, I agree</label>
      <input type="checkbox" id="tos_agree" name="tos_agree">
    </div>
    <button>Register</button>
    
  </form>
  
  
</body>
</html>
